name: Extract missing icons

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite existing icons"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "build-tools;35.0.0"
      - run: sudo apt-get update && sudo apt-get install -y unzip imagemagick librsvg2-bin
      - name: Install apktool
        run: |
          mkdir -p .tmp
          curl -L -o .tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.1/apktool_3.0.1.jar
      - name: Extract APK icons
        env:
          APKTOOL_JAR: .tmp/apktool.jar
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            node scripts/extract-missing-icons.mjs --force
          else
            node scripts/extract-missing-icons.mjs
          fi
      - run: node scripts/build-registry.mjs
      - name: Create icon pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- assets/icons)" ]; then
            git checkout -- dist/apps.v1.json
            echo "No icon changes to propose."
            exit 0
          fi

          branch="automation/extract-icons"
          body=".tmp/extract-icons-report.md"
          mkdir -p .tmp
          {
            echo "# Extract missing app icons"
            echo
            echo "Generated icon assets for review."
            echo
            echo '```text'
            git status --short assets/icons dist/apps.v1.json
            echo '```'
          } > "$body"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch"
          git add assets/icons/*.png dist/apps.v1.json
          git commit -m "Extract missing app icons"
          git push --force-with-lease origin "$branch"

          number="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$body"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Extract missing app icons" \
              --body-file "$body"
          fi
